<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تهنئة عيد الأضحى</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    
    <audio id="eidAudio" src="https://incredible-capybara-5c3482.netlify.app/music.mp3" preload="auto"></audio>

    <div class="card-container">
        
        <div id="input-section">
            <h2 class="input-title">ادخل اسمك</h2>
            <input type="text" id="nameInput" placeholder="">
            <br>
            <button id="submitBtn">إدخال</button>
        </div>

        <div id="greeting-section" style="display: none;">
            <h3 class="top-greeting">كل سنة وانت طيب/ه</h3>
            <h1 class="highlight">💕 <span id="displayName"></span> 💕</h1>
            <p class="message">
                عيد أضحى مبارك عليك، يارب يكون عيد مليان فرحة وراحة بال ورزق وسعادة، وتحقق كل اللي نفسك فيه
                <br><br>
                <strong>وعساكم من عواده دايماً بخير وصحة وفرح</strong>
                <H2>🌹🌹🌹</H2>
                <P> --------</P>
            </p>
            <div class="hearts">💕 💕 💕 💕 💕</div>
            <button id="resetBtn">رجوع</button>
        </div>

    </div>
    <div class="developer-info">
      " كل عام وأنت والأسرة بخير وسعادة بمناسبة عيد الاضحي المبارك🐑 🥳
    </div>

    <script src="script.js"></script>
</body>
</html>
